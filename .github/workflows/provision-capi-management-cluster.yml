name: Bootstrap & Sync Management Cluster
concurrency:
  group: provision-capi-management-cluster
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - clusters/**
  workflow_dispatch:

permissions:
  contents: write

env:
  CAPI_VERSION: v1.13.4
  ARGOCD_CHART_VERSION: 10.2.1
  KUBECONFIG: /etc/rancher/k3s/k3s.yaml

jobs:
  bootstrap:
    # Self-hosted runner on the VPS (see scripts/runner-setup.sh) — no inbound SSH needed
    runs-on: [self-hosted, linux, vps]
    timeout-minutes: 40
    outputs:
      child_clusters: ${{ steps.config.outputs.child_clusters }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover child clusters
        id: config
        run: |
          CHILD_CLUSTERS=$(ls -d clusters/child/*/ 2>/dev/null | xargs -I{} basename {} | tr '\n' ' ')
          echo "child_clusters=${CHILD_CLUSTERS}" >> $GITHUB_OUTPUT

      - name: Ensure tooling (kubectl, helm, clusterctl)
        run: |
          command -v kubectl >/dev/null || { KUBE_VER=$(curl -fsSL https://dl.k8s.io/release/stable.txt); sudo curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBE_VER}/bin/linux/amd64/kubectl"; sudo chmod +x /usr/local/bin/kubectl; }
          command -v helm >/dev/null || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash
          command -v clusterctl >/dev/null || { sudo curl -fsSLo /usr/local/bin/clusterctl "https://github.com/kubernetes-sigs/cluster-api/releases/download/${CAPI_VERSION}/clusterctl-linux-amd64"; sudo chmod +x /usr/local/bin/clusterctl; }
          echo "kubectl: $(kubectl version --client 2>/dev/null | head -1) | helm: $(helm version --short 2>/dev/null) | clusterctl: $(clusterctl version 2>&1 | head -1)"

      - name: Ensure K3s
        run: |
          if systemctl is-active --quiet k3s 2>/dev/null; then
            echo "K3s already running"
          else
            curl -fsSL https://get.k3s.io -o /tmp/k3s-install.sh
            sudo INSTALL_K3S_EXEC="--write-kubeconfig-mode=644" sh /tmp/k3s-install.sh
            sudo systemctl enable --now k3s
          fi
          for i in $(seq 1 30); do
            kubectl get nodes --no-headers 2>/dev/null | grep -q Ready && { echo "K3s ready after ${i}s"; break; }
            sleep 2
          done
          kubectl get nodes -o wide

      - name: Ensure Docker
        run: |
          command -v docker >/dev/null || { curl -fsSL https://get.docker.com | sudo sh; }
          docker version

      - name: Install CAPI (pinned versions)
        run: |
          clusterctl init --infrastructure docker \
            --core cluster-api:${CAPI_VERSION} \
            --bootstrap kubeadm:${CAPI_VERSION} \
            --control-plane kubeadm:${CAPI_VERSION} 2>&1 || true
          kubectl wait --for=condition=Available deployment/capi-controller-manager -n capi-system --timeout=5m 2>/dev/null || true
          kubectl wait --for=condition=Available deployment/capd-controller-manager -n capd-system --timeout=5m 2>/dev/null || true
          kubectl get pods -A | grep -E "capi|capd|NAME" || true

      - name: Decommission Flux (controllers first, then CRs — no cascade pruning)
        run: |
          if kubectl get ns flux-system &>/dev/null; then
            echo "Flux detected — decommissioning..."
            # Stop the operator and FluxInstance first so controllers cannot be recreated
            kubectl -n flux-system patch fluxinstance flux -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
            kubectl -n flux-system delete fluxinstance flux --ignore-not-found 2>/dev/null || true
            kubectl -n flux-system delete deploy flux-operator --ignore-not-found 2>/dev/null || true
            kubectl -n flux-system delete deploy source-controller kustomize-controller helm-controller notification-controller --ignore-not-found 2>/dev/null || true
            # Explicitly delete ALL Flux controllers — do NOT rely on FluxInstance
            # deletion cascading (it didn't; controllers kept running as orphans).
            # CRITICAL: while kustomize-controller/helm-controller live, deleting their
            # Kustomizations/HelmReleases would cascade-prune everything they applied
            # (incl. the CAPI child cluster). Wait until both are gone.
            for i in $(seq 1 30); do
              if kubectl -n flux-system get deploy kustomize-controller &>/dev/null || kubectl -n flux-system get deploy helm-controller &>/dev/null; then
                sleep 5
              else
                echo "  kustomize-controller + helm-controller down after ~$((i*5))s"
                break
              fi
            done
            if kubectl -n flux-system get deploy kustomize-controller &>/dev/null || kubectl -n flux-system get deploy helm-controller &>/dev/null; then
              echo "  FATAL: Flux controllers still running — aborting to protect the child cluster"
              exit 1
            fi
            # Controllers dead → strip finalizers and purge CRs (inventory survives as orphans)
            for res in kustomizations gitrepositories helmrepositories; do
              kubectl -n flux-system get "$res" -o name 2>/dev/null | xargs -r -I{} kubectl -n flux-system patch {} -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
              kubectl -n flux-system delete "$res" --all --ignore-not-found 2>/dev/null || true
            done
            kubectl -n projectsveltos get helmreleases -o name 2>/dev/null | xargs -r -I{} kubectl -n projectsveltos patch {} -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
            kubectl -n projectsveltos delete helmrelease --all --ignore-not-found 2>/dev/null || true
            kubectl delete ns flux-system --ignore-not-found 2>/dev/null || true
            echo "Flux decommissioned — ArgoCD owns the stack from here"
          else
            echo "No Flux found — nothing to decommission"
          fi

      - name: Install ArgoCD (Helm)
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            --version "${ARGOCD_CHART_VERSION}" \
            --values clusters/management/argocd/values.yaml \
            --wait --timeout 5m
          kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=3m 2>/dev/null || true
          kubectl wait --for=condition=Available deployment/argocd-application-controller -n argocd --timeout=3m 2>/dev/null || true
          kubectl wait --for=condition=Available deployment/argocd-repo-server -n argocd --timeout=3m 2>/dev/null || true
          kubectl get pods -n argocd

      - name: Bootstrap app-of-apps (AppProject + root Application)
        run: |
          kubectl apply -f clusters/management/apps/project.yaml
          kubectl apply -f clusters/management/bootstrap.yaml
          echo "ArgoCD will now reconcile:"
          echo "  - CAPI clusters    (clusters/child/*)"
          echo "  - Sveltos          (Helm charts + ClusterProfiles)"
          echo "  - Child workloads  (clusters/child/*/apps)"

      - name: Wait for Sveltos and child clusters
        run: |
          echo "Waiting for Sveltos addon-controller (installed via ArgoCD)..."
          for i in $(seq 1 30); do
            kubectl get deployment addon-controller -n projectsveltos &>/dev/null && { echo "Sveltos ready"; break; }
            sleep 10
          done
          kubectl wait --for=condition=Available deployment/addon-controller -n projectsveltos --timeout=5m 2>/dev/null || true
          echo "Waiting for child clusters..."
          CHILD_CLUSTERS="${{ steps.config.outputs.child_clusters }}"
          mkdir -p /tmp/kubeconfigs
          for child in $CHILD_CLUSTERS; do
            for i in $(seq 1 36); do
              phase=$(kubectl get cluster "$child" -n default -o jsonpath={.status.phase} 2>/dev/null || echo "")
              if [ "$phase" = "Provisioned" ]; then
                echo "  $child is Provisioned after ~$((i * 10))s"; break
              fi
              echo "  $child phase: ${phase:-N/A} (retry $i/36)..."
              sleep 10
            done
            clusterctl get kubeconfig "$child" -n default > "/tmp/kubeconfigs/$child.yaml" 2>/dev/null || true
            if [ -s "/tmp/kubeconfigs/$child.yaml" ]; then
              # 1) Sveltos: SveltosCluster <child> consumes secret <child>-kubeconfig (ns default)
              kubectl create secret generic "$child-kubeconfig" -n default \
                --from-file=value="/tmp/kubeconfigs/$child.yaml" --dry-run=client -o yaml | kubectl apply -f -
              echo "  OK kubeconfig secret '$child-kubeconfig' injected for Sveltos"
              # 2) ArgoCD: register <child> as a managed cluster (apps use destination.name)
              kubectl config view --kubeconfig="/tmp/kubeconfigs/$child.yaml" --flatten -o json > "/tmp/kubeconfigs/$child.json"
              SERVER=$(python3 -c "import json;print(json.load(open('/tmp/kubeconfigs/$child.json'))['clusters'][0]['cluster']['server'])")
              CONFIG=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/kubeconfigs/$child.json'))))")
                    kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: $child
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: cluster
          stringData:
            name: $child
            server: $SERVER
            config: |
              $CONFIG
          EOF
              echo "  OK ArgoCD cluster '$child' registered ($SERVER)"
              kubectl -n argocd annotate application "${child}-apps" argocd.argoproj.io/refresh="$(date +%s)" --overwrite 2>/dev/null || true
            fi
          done
          kubectl get clusters -A -o wide || true
          kubectl get machines -A -o wide || true
          kubectl get applications -n argocd || true

      - name: Summary
        run: |
          echo "=============================================="
          echo "  Super-Cluster GitOps pipeline done (ArgoCD)"
          echo "=============================================="
          echo "  ArgoCD UI : http://localhost:30080 (or via tailnet 100.110.156.93:30080)"
          echo "  User      : admin"
          PASS=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' 2>/dev/null | base64 -d)
          echo "  Password  : ${PASS:-<run: kubectl -n argocd get secret argocd-initial-admin-secret>}"
          echo "=============================================="
          echo "  To add a new child cluster:"
          echo "    1. Create clusters/child/<name>/cluster.yaml"
          echo "    2. Add clusters/management/apps/capi-<name>.yaml (+ <name>-apps.yaml)"
          echo "    3. Push to main — ArgoCD + CAPI auto-provisions"
          echo "=============================================="
