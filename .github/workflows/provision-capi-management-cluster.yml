name: Bootstrap & Sync Management Cluster
concurrency:
  group: provision-capi-management-cluster
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - clusters/**
  workflow_dispatch:

permissions:
  contents: write

env:
  SSH_OPTS: >-
    -o StrictHostKeyChecking=no
    -o PreferredAuthentications=password
    -o PubkeyAuthentication=no
    -o UserKnownHostsFile=/dev/null
    -o LogLevel=ERROR
  CAPI_VERSION: v1.13.4
  SVELTOS_VERSION: v1.13.0

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      child_clusters: ${{ steps.config.outputs.child_clusters }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Discover child clusters
        id: config
        shell: nix-shell shell.nix --run "bash {0}"
        run: |
          CHILD_CLUSTERS=$(ls -d clusters/child/*/ 2>/dev/null | xargs -I{} basename {} | tr n  )
          echo "child_clusters=${CHILD_CLUSTERS}" >> $GITHUB_OUTPUT
      - name: Install clusterctl
        run: |
          curl -sL "https://github.com/kubernetes-sigs/cluster-api/releases/download/${CAPI_VERSION}/clusterctl-linux-amd64" -o /usr/local/bin/clusterctl
          chmod +x /usr/local/bin/clusterctl
          echo "clusterctl: $(clusterctl version 2>&1 | head -1)"
      - name: SSH connectivity
        shell: nix-shell shell.nix --run "bash {0}"
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: sshpass -e ssh $SSH_OPTS "${{ secrets.USER }}@${{ secrets.HOST }}" "echo SSH_OK"
      - name: Ensure K3s
        shell: nix-shell shell.nix --run "bash {0}"
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPTS "${{ secrets.USER }}@${{ secrets.HOST }}" bash -s << REMOTE
          set -euo pipefail
          if command -v k3s && systemctl is-active --quiet k3s; then
            echo "K3s already running"
          else
            curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--write-kubeconfig-mode=644" sh -
            systemctl enable --now k3s
          fi
          for i in $(seq 1 30); do
            kubectl get nodes --no-headers 2>/dev/null | grep -q Ready && { echo "K3s ready after ${i}s"; break; }
            sleep 2
          done
          REMOTE
      - name: Ensure Docker
        shell: nix-shell shell.nix --run "bash {0}"
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPTS "${{ secrets.USER }}@${{ secrets.HOST }}" bash -s << REMOTE
          command -v docker || curl -fsSL https://get.docker.com | sh
          docker version
          REMOTE
      - name: Retrieve kubeconfig
        shell: nix-shell shell.nix --run "bash {0}"
        env:
          SSHPASS: ${{ secrets.PASSWORD }}
        run: |
          mkdir -p /tmp/kubeconfigs
          sshpass -e ssh $SSH_OPTS "${{ secrets.USER }}@${{ secrets.HOST }}" \
            sudo cat /etc/rancher/k3s/k3s.yaml > /tmp/kubeconfigs/mgmt.yaml
          sed -i "s/127.0.0.1/${{ secrets.HOST }}/g" /tmp/kubeconfigs/mgmt.yaml
      - name: Install CAPI (pinned versions)
        env:
          KUBECONFIG: /tmp/kubeconfigs/mgmt.yaml
        run: |
          clusterctl init --infrastructure docker \
            --core cluster-api:${CAPI_VERSION} \
            --bootstrap kubeadm:${CAPI_VERSION} \
            --control-plane kubeadm:${CAPI_VERSION} 2>&1 || true
          kubectl wait --for=condition=Available deployment/capi-controller-manager -n capi-system --timeout=5m 2>/dev/null || true
          kubectl wait --for=condition=Available deployment/capd-controller-manager -n capd-system --timeout=5m 2>/dev/null || true
          kubectl get pods -A | grep -E "capi|capd|NAME" || true
      - name: Create git secret
        env:
          KUBECONFIG: /tmp/kubeconfigs/mgmt.yaml
          GH_PAT: ${{ secrets.GH_PAT }}
        run: envsubst < clusters/management/flux-operator/git-secret.yaml | kubectl apply -f -
      - name: Install Flux + FluxInstance
        env:
          KUBECONFIG: /tmp/kubeconfigs/mgmt.yaml
        run: |
          kubectl apply -f clusters/management/flux-operator/install.yaml 2>/dev/null || true
          kubectl wait --for=condition=Available deployment/flux-operator -n flux-system --timeout=3m 2>/dev/null || true
          kubectl apply -f clusters/management/flux-operator/flux-instance.yaml
          for i in $(seq 1 30); do
            kubectl get deployment source-controller -n flux-system &>/dev/null && break
            sleep 10
          done
          kubectl wait --for=condition=Available deployment/source-controller -n flux-system --timeout=3m 2>/dev/null || true
          kubectl wait --for=condition=Available deployment/kustomize-controller -n flux-system --timeout=3m 2>/dev/null || true
          echo "Flux controllers ready"
      - name: Expose Flux Web UI
        env:
          KUBECONFIG: /tmp/kubeconfigs/mgmt.yaml
        run: kubectl apply -f clusters/management/flux-operator/flux-web-nodeport.yaml
      - name: Install Sveltos (pinned in-repo)
        env:
          KUBECONFIG: /tmp/kubeconfigs/mgmt.yaml
        run: |
          kubectl apply -f clusters/management/sveltos/crds/
          kubectl apply -f clusters/management/sveltos/sveltos-addon-controller.yaml
          kubectl wait --for=condition=Available deployment/addon-controller -n projectsveltos --timeout=3m
          kubectl get pods -n projectsveltos
      - name: Force Flux reconcile
        env:
          KUBECONFIG: /tmp/kubeconfigs/mgmt.yaml
        run: |
          kubectl annotate --overwrite gitrepository/flux-system -n flux-system \
            flux.fluxcd.io/reconcileAt="$(date +%s)"
          sleep 15
          kubectl get clusters -A -o wide 2>/dev/null || echo "No clusters yet"
          kubectl get clusterprofile 2>/dev/null || echo "No ClusterProfiles yet"
      - name: Inject child kubeconfigs
        env:
          KUBECONFIG: /tmp/kubeconfigs/mgmt.yaml
        run: |
          CHILD_CLUSTERS="${{ steps.config.outputs.child_clusters }}"
          for child in $CHILD_CLUSTERS; do
            for i in $(seq 1 36); do
              phase=$(kubectl get cluster "$child" -n default -o jsonpath={.status.phase} 2>/dev/null || echo "")
              if [ "$phase" = "Provisioned" ]; then
                echo "  $child is Provisioned after ~$((i * 10))s"; break
              fi
              echo "  $child phase: ${phase:-N/A} (retry $i/36)..."
              sleep 10
            done
            kubectl get secret "kubeconfig-$child" -n flux-system &>/dev/null && continue
            clusterctl get kubeconfig "$child" -n default > "/tmp/kubeconfigs/$child.yaml" 2>/dev/null || true
            if [ -s "/tmp/kubeconfigs/$child.yaml" ]; then
              kubectl create secret generic "kubeconfig-$child" -n flux-system \
                --from-file=value=/tmp/kubeconfigs/$child.yaml --dry-run=client -o yaml | kubectl apply -f -
            fi
          done
          kubectl get clusters -A -o wide || true
          kubectl get machines -A -o wide || true
      - name: Summary
        run: echo "CAPI: ${CAPI_VERSION}, Sveltos: ${SVELTOS_VERSION}"
