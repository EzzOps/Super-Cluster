apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  annotations:
    projectsveltos.io/onboard: "true"
  labels:
    env: prod
  name: child-1
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    services:
      cidrBlocks:
      - 10.96.0.0/12
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io/v1beta2
    kind: KubeadmControlPlane
    name: child-1-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io/v1beta2
    kind: DockerCluster
    name: child-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerCluster
metadata:
  name: child-1
  namespace: default
spec:
  controlPlaneEndpoint:
    host: 172.19.0.3
    port: 6443
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: child-1-control-plane
  namespace: default
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      controllerManager:
        extraArgs:
        - name: bind-address
          value: 0.0.0.0
    format: cloud-config
    initConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
    joinConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/containerd/containerd.sock
        kubeletExtraArgs:
        - name: cloud-provider
          value: external
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: DockerMachineTemplate
        name: child-1-control-plane
  replicas: 1
  rollout:
    strategy:
      rollingUpdate:
        maxSurge: 1
      type: RollingUpdate
  version: v1.29.2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: child-1-control-plane
  namespace: default
spec:
  template:
    spec: {}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: child-1-md-0
  namespace: default
spec:
  clusterName: child-1
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: child-1
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: child-1
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: child-1-md-0
      clusterName: child-1
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io/v1beta2
        kind: DockerMachineTemplate
        name: child-1-md-0
      version: v1.29.2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DockerMachineTemplate
metadata:
  name: child-1-md-0
  namespace: default
spec:
  template:
    spec: {}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: child-1-md-0
  namespace: default
spec:
  template:
    spec:
      format: cloud-config
      joinConfiguration:
        discovery:
          bootstrapToken:
            apiServerEndpoint: 172.19.0.3:6443
