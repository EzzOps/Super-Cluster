apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: capi-bootstrap-cni
spec:
  clusterSelector:
    matchLabels:
      env: prod
  helmCharts:
  - chartName: cilium/cilium
    chartVersion: 1.16.0
    helmChartAction: Install
    releaseName: cilium
    releaseNamespace: kube-system
    repositoryName: cilium
    repositoryURL: https://helm.cilium.io
    values: "kubeProxyReplacement: \"disabled\"\ncni:\n  chainingMode: portmap\nipam:\n\
      \  mode: kubernetes\n"
  syncMode: OneTime
