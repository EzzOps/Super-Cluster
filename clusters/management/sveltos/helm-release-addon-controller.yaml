apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sveltos-addon-controller
  namespace: projectsveltos
spec:
  interval: 1h
  chart:
    spec:
      chart: projectsveltos
      version: "1.12.7"
      sourceRef:
        kind: HelmRepository
        name: projectsveltos
        namespace: flux-system
      interval: 1h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    global:
      capiOnboardAnnotation: "projectsveltos.io/onboard"
    addonController:
      controller:
        image:
          tag: v1.13.0
      manager:
        image:
          tag: v1.13.0
    accessManager:
      enabled: false
    sveltosClusterProxy:
      enabled: false
    sveltosDashboard:
      enabled: false
