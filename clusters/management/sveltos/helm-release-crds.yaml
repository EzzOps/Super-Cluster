apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sveltos-crds
  namespace: projectsveltos
spec:
  interval: 1h
  chart:
    spec:
      chart: sveltos-crds
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: projectsveltos
        namespace: flux-system
      interval: 1h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
