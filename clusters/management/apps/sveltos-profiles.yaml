apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sveltos-profiles
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: super-cluster
  source:
    repoURL: https://github.com/EzzOps/Super-Cluster.git
    targetRevision: HEAD
    path: clusters/management/sveltos
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
